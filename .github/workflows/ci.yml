name: Verify

on:
  push:
    branches: [main, fix/prototype-stabilization]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:hosting
      - name: Measure synthetic documents
        run: npx playwright test --config playwright.performance.config.ts
      - name: Confirm verification did not modify tracked files
        run: git diff --exit-code
      - name: Retain synthetic browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-browser-evidence
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
